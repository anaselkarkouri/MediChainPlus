# MediChain+ — Orchestration complète
# Usage: docker compose up --build
# Services: hardhat | ipfs | api | frontend
# Pour Fabric: voir fabric-anas/docker-compose.yml

services:
  # ── Hardhat node (EVM local) ──────────────────────────────────────────────
  hardhat:
    build:
      context: .
      dockerfile: docker/Dockerfile.hardhat
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(d=>{if(d.result!=='0x7a69')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - medichain

  # ── Deploy contracts (one-shot) ───────────────────────────────────────────
  deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile.hardhat
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "localhost"]
    environment:
      - LOCAL_RPC_URL=http://hardhat:8545
      - MEDICHAIN_DEPLOYMENT_FILE=/deployments/local.json
    volumes:
      - deployments:/deployments
    depends_on:
      hardhat:
        condition: service_healthy
    networks:
      - medichain

  # ── IPFS Kubo ─────────────────────────────────────────────────────────────
  ipfs:
    image: ipfs/kubo:v0.27.0
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8082:8080"
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medichain

  # ── API Gateway ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_RPC_URL=http://hardhat:8545
      - MEDICHAIN_DEPLOYMENT_FILE=/deployments/local.json
      - IPFS_API_URL=http://ipfs:5001
      - IPFS_GATEWAY_URL=http://127.0.0.1:8082/ipfs
      - FABRIC_MODE=${FABRIC_MODE:-mock}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - deployments:/deployments:ro
    depends_on:
      hardhat:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medichain

  # ── Frontend React ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medichain

  # ── Fabric Bridge (event listener) ───────────────────────────────────────
  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["node", "api/fabricBridge.cjs"]
    env_file:
      - .env
    environment:
      - API_RPC_URL=http://hardhat:8545
      - FABRIC_MODE=${FABRIC_MODE:-mock}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medichain
    profiles:
      - bridge

volumes:
  deployments:
  ipfs_data:

networks:
  medichain:
    driver: bridge
