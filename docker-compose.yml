version: "3.9"

# MediChain+ — Orchestration complète
# Usage: docker compose up --build
# Services: hardhat | ipfs | api | frontend
# Pour Fabric: voir fabric-anas/docker-compose.yml

services:
  # ── Hardhat node (EVM local) ──────────────────────────────────────────────
  hardhat:
    build:
      context: .
      dockerfile: docker/Dockerfile.hardhat
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - medichain

  # ── Deploy contracts (one-shot) ───────────────────────────────────────────
  deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile.hardhat
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "localhost"]
    environment:
      - RPC_URL=http://hardhat:8545
      - PRIVATE_KEY=${PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    depends_on:
      hardhat:
        condition: service_healthy
    networks:
      - medichain

  # ── IPFS Kubo ─────────────────────────────────────────────────────────────
  ipfs:
    image: ipfs/kubo:v0.27.0
    ports:
      - "5001:5001"
      - "8082:8080"
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medichain

  # ── API Gateway ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - API_RPC_URL=http://hardhat:8545
      - IPFS_API_URL=http://ipfs:5001
      - FABRIC_MODE=${FABRIC_MODE:-mock}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      hardhat:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medichain

  # ── Frontend React ────────────────────────────────────────────────────────
  frontend:
    build:
      context: frontend-react
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medichain

  # ── Fabric Bridge (event listener) ───────────────────────────────────────
  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["node", "api/fabricBridge.cjs"]
    env_file:
      - .env
    environment:
      - API_RPC_URL=http://hardhat:8545
      - FABRIC_MODE=${FABRIC_MODE:-mock}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medichain
    profiles:
      - bridge

volumes:
  ipfs_data:

networks:
  medichain:
    driver: bridge
